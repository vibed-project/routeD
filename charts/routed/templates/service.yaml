apiVersion: v1
kind: Service
metadata:
  name: {{ include "routed.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "routed.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "routed.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if eq .Values.mode "extproc" }}
    - name: grpc
      port: {{ .Values.service.extprocPort }}
      targetPort: grpc
      protocol: TCP
    {{- end }}
