# SPDX-License-Identifier: Apache-2.0
# Envoy in front of the mock gateway with routed as ext_proc (ADR-0017).
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
    static_resources:
      listeners:
        - name: ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 10000 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress
                    route_config:
                      name: local
                      virtual_hosts:
                        - name: all
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route:
                                cluster: gateway
                                timeout: 0s
                    http_filters:
                      - name: envoy.filters.http.ext_proc
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc:
                              cluster_name: routed_extproc
                            timeout: 5s
                          failure_mode_allow: false
                          allow_mode_override: true
                          message_timeout: 2s
                          processing_mode:
                            request_header_mode: SEND
                            request_body_mode: BUFFERED
                            response_header_mode: SEND
                            response_body_mode: NONE
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: routed_extproc
          type: STRICT_DNS
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: routed_extproc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: routed, port_value: 9002 }
        - name: gateway
          type: STRICT_DNS
          load_assignment:
            cluster_name: gateway
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: routed-mockgateway, port_value: 4000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
spec:
  replicas: 1
  selector:
    matchLabels: { app: envoy }
  template:
    metadata:
      labels: { app: envoy }
    spec:
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.33-latest
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - containerPort: 10000
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
          readinessProbe:
            tcpSocket: { port: 10000 }
            initialDelaySeconds: 2
            periodSeconds: 3
      volumes:
        - name: config
          configMap:
            name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
spec:
  selector: { app: envoy }
  ports:
    - name: http
      port: 10000
      targetPort: 10000
