  sovereignty: { jurisdiction: EU, dataResidency: eu-de, operatorControl: eu-entity, cloudActExposed: true, allowedDataClasses: [public, internal, personal] }
---
apiVersion: routed.io/v1alpha1
kind: RouterProfile
metadata: { name: default, namespace: ai-platform }
spec:
  classifier: { type: heuristic, timeoutMs: 25 }
  costModel: { fxToEUR: { USD: 0.9 }, defaultOutputTokens: 256 }
---
apiVersion: routed.io/v1alpha1
kind: RoutingPolicy
metadata: { name: default-cost-secure, namespace: ai-platform }
spec:
  priority: 100
  match: { tenants: ["*"], paths: ["/v1/chat/completions", "/v1/messages", "/v1/responses", "/v1/completions"], modelAliases: ["auto", "routed/*"] }
  hardConstraints: { respectDataClass: true, maxCostPerRequestEUR: 0.05, denyIfRiskScoreAbove: 0.95 }
  objective: { mode: quality-first, qualityFloor: 0.75 }
  reasoningBudget: { enabled: true, map: { low: none, medium: low, high: high } }
  fallbackDecision: { tier: eu-sovereign-large }
  explain: true
---
apiVersion: routed.io/v1alpha1
kind: RoutingPolicy
metadata: { name: vision-only, namespace: ai-platform }
spec:
  priority: 200
  match: { tenants: ["vision-team"], modelAliases: ["auto"] }
  candidates: { exclude: [eu-sovereign-large] }
  hardConstraints: { requireCapabilities: [vision] }
---
apiVersion: routed.io/v1alpha1
kind: RoutingPolicy
metadata: { name: strict-quality, namespace: ai-platform }
spec:
  priority: 300
  match: { tenants: ["research"], modelAliases: ["auto"] }
  objective: { mode: cost-first-with-quality-floor, qualityFloor: 0.99 }
