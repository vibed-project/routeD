# Operator ClusterRole (kept in sync with charts/routed/templates/rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: routed-operator
rules:
  - apiGroups: ["routed.io"]
    resources: ["modeltiers", "dataclasses", "routingpolicies", "routerprofiles"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["routed.io"]
    resources: ["modeltiers/status", "dataclasses/status", "routingpolicies/status", "routerprofiles/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
