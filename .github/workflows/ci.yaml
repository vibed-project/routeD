name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs run pull-request code, so the default token must not publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - run: make fmt-check CARGO=cargo

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: make clippy CARGO=cargo

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: make build test CARGO=cargo
      - name: CRD manifests are up to date
        run: make crd-check CARGO=cargo

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # No toolchain needed: SPDX headers, crate boundaries, toolchain pin consistency.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make hygiene

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - run: make helm-lint

  # Publish images only from main in the canonical repository; the only job with write access.
  container:
    needs: [fmt, clippy, test, deny, hygiene, helm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'vibed-project/routed'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: echo "short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push routed
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/routed.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/vibed-project/routed:${{ github.sha }}-${{ matrix.suffix }}
          build-args: COMMIT=${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=routed-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=routed-${{ matrix.suffix }}
      - name: Build and push routed-operator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/routed-operator.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/vibed-project/routed-operator:${{ github.sha }}-${{ matrix.suffix }}
          build-args: COMMIT=${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=routed-operator-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=routed-operator-${{ matrix.suffix }}

  manifest:
    needs: [container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'vibed-project/routed'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests
        # Also tag with the workspace version so the chart's default image tag (appVersion) resolves.
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for img in routed routed-operator; do
            docker buildx imagetools create \
              -t ghcr.io/vibed-project/$img:${GITHUB_SHA} \
              -t ghcr.io/vibed-project/$img:${version} \
              -t ghcr.io/vibed-project/$img:latest \
              ghcr.io/vibed-project/$img:${GITHUB_SHA}-amd64 \
              ghcr.io/vibed-project/$img:${GITHUB_SHA}-arm64
          done
