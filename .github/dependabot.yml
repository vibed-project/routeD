version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The toolchain version in this action must match rust-toolchain.toml
      # (scripts/check-hygiene.sh); bumps are coordinated changes.
      - dependency-name: "dtolnay/rust-toolchain" 
  - package-ecosystem: docker
    directory: "/build"
    schedule:
      interval: weekly
    ignore:
      # The Rust toolchain is pinned across rust-toolchain.toml, the
      # toolchain Containerfile and CI; bumping it is a coordinated change
      # the hygiene check enforces, not a base-image bump.
      - dependency-name: "library/rust" 
