[workspace]
resolver = "3"
members = ["cmd/*", "crates/*", "test/mockgateway"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/vibed-project/routed"
homepage = "https://github.com/vibed-project/routed"
authors = ["routeD contributors"]
publish = false

[workspace.dependencies]
# --- Phase 0 (in use) ---
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# --- Kubernetes types (derive-only default; routed-operator adds client/runtime features) ---
kube = { version = "4.2", default-features = false, features = ["derive"] }
k8s-openapi = { version = "0.28", features = ["v1_34", "schemars"] }
schemars = "1"
# --- Phase 1 ---
arc-swap = "1"
sha2 = "0.11"
hex = "0.4"
ulid = "3"
rand = "0.10"
regex = "1"
strum = { version = "0.28", features = ["derive"] }
proptest = "1"
rstest = "0.26"
criterion = { version = "0.8", default-features = false }
# --- Phase 2: HTTP + telemetry ---
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio", "query"] }
hyper = { version = "1", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "limit"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.23"
indexmap = { version = "2", features = ["serde"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.33"
prometheus-client = "0.25"
# --- Phase 3: operator / gRPC snapshot distribution ---
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["router", "server", "channel", "codegen", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
# --- Phase 5: Envoy ext_proc (pre-generated tonic bindings for the envoy protos) ---
envoy-types = "0.7"
# --- cosign artifact signature verification (ADR-0022) ---
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
base64ct = { version = "1", features = ["alloc"] }
# --- Phase 4: ONNX inference (behind the `onnx` feature, ADR-0002/0016) ---
# load-dynamic (ADR-0002 fallback 1): the pyke static binaries need a newer
# libstdc++ than the pinned bookworm toolchain ships; the Microsoft shared
# library is loaded at runtime via ORT_DYLIB_PATH instead (`make onnx`).
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic", "std"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# --- workspace crates ---
routed-version = { path = "crates/version" }
routed-api = { path = "crates/api" }
routed-artifact = { path = "crates/artifact" }
routed-proto = { path = "crates/proto" }
routed-snapshot = { path = "crates/snapshot" }
routed-policy = { path = "crates/policy" }
routed-decision = { path = "crates/decision" }
routed-classify = { path = "crates/classify" }
routed-embed = { path = "crates/embed" }
routed-security = { path = "crates/security" }
routed-cache = { path = "crates/cache" }
routed-router = { path = "crates/router" }
routed-feedback = { path = "crates/feedback" }
routed-telemetry = { path = "crates/telemetry" }
routed-ingress-inline = { path = "crates/ingress-inline" }
routed-ingress-extproc = { path = "crates/ingress-extproc" }
routedctl = { path = "cmd/routedctl" }
routed-mockgateway = { path = "test/mockgateway" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Style lints that fight readability in this codebase:
collapsible_if = "allow"          # let-chain rewrites do not improve the constraint checks
too_many_lines = "allow"          # the compiler and scorer are long, linear validation passes
cast_precision_loss = "allow"     # u64 micro-EUR / ms values are far below 2^53 when cast for scoring
struct_excessive_bools = "allow"  # compiled policies carry several independent boolean flags
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
